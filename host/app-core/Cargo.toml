[package]
name = "ninjoy-app-core"
description = "Ninjoy desktop app core: controllers, saved settings, the local command channel and the command line, without a window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ninjoy-session.workspace = true
ninjoy-devices.workspace = true
tokio.workspace = true
tracing.workspace = true
directories.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
