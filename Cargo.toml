[workspace]
resolver = "3"
members = ["host/session", "host/devices", "host/app-core", "host/devhost"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88" # let-chains
license = "GPL-3.0-only"
repository = "https://github.com/Onutirachi/Ninjoy"

[workspace.dependencies]
ninjoy-session = { path = "host/session" }
ninjoy-devices = { path = "host/devices" }
ninjoy-app-core = { path = "host/app-core" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-std", "io-util", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "query"] }
# rustls with the ring provider: aws-lc (rustls' default) needs extra build tools on Windows
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14.10"
mdns-sd = "0.21.6"
if-addrs = "0.15.0"
directories = "6.0.0"
rust-embed = "8.13.0"
mime_guess = "2.0.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30.0"
serde_json = "1"
