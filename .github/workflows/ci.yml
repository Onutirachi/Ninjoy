name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      # the host embeds the built controller page; the desktop app embeds its window
      - run: npm run build --workspace @ninjoy/controller
      - run: npm run build --workspace @ninjoy/desktop
      - name: Linux packages for the desktop app (web view, tray)
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # the Linux virtual controller test creates a real DualShock 4 through UHID
      - name: Allow UHID and input devices for the tests
        run: |
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe uhid
          sudo modprobe hid-playstation || true
          echo 'KERNEL=="uhid", MODE="0666"' | sudo tee /etc/udev/rules.d/99-ninjoy-ci.rules
          echo 'KERNEL=="hidraw*", MODE="0666"' | sudo tee -a /etc/udev/rules.d/99-ninjoy-ci.rules
          echo 'SUBSYSTEM=="input", MODE="0666"' | sudo tee -a /etc/udev/rules.d/99-ninjoy-ci.rules
          sudo udevadm control --reload
          sudo udevadm trigger
          sudo chmod 666 /dev/uhid
      - run: cargo test --workspace
